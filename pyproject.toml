[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smol-llm-proxy"
version = "0.4.2"
description = "Lightweight API key proxy for llama.cpp server with token usage tracking"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Yulia Yakovleva", email = "robolamp@robolamp.me"},
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "orjson>=3.9.0",
    "uvloop>=0.19.0; sys_platform != 'win32'",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["proxy", "llama.cpp", "llm", "api-key", "routing"]

[project.urls]
"GitHub" = "https://github.com/robolamp/smol-llm-proxy"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-rerunfailures>=14.0", "ruff>=0.6.0"]
bench = ["locust>=2.31.0"]

[project.scripts]
smol-llm-proxy = "smol_llm_proxy.__main__:main"

[tool.setuptools.packages.find]
include = ["smol_llm_proxy*"]

[tool.setuptools.package-data]
smol_llm_proxy = [".env.example", "config.example.yaml", "entrypoint.sh"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
markers = [
    "real_proxy: real uvicorn integration tests (slow, require network)",
]
