services:
  app:
    build: .
    ports:
      - "${PROXY_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DB_PATH=${DB_CONTAINER_PATH:-/app/data/proxy.db}
      - CONFIG_PATH=/config/config.yaml
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ./config.yaml:/config/config.yaml:ro
    restart: unless-stopped
